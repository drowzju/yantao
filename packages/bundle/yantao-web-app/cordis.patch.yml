# The dsh-yantao-web-app bundle patch: the yantao workbench browser surface,
# applied after dsh-base and dsh-yantao. It reuses the STOCK web frontend dist
# and the web transport/roster mechanism, with a workbench composition: the
# sidebar becomes the KB tree, the details column becomes the KB markdown
# editor, and the chat agent is the boundary-respecting yantao preset.
#
# The yantao layer already owns the GLM route, the default model, the Chinese
# persona, the yantao-kb plugin, and the headless-side tool disables, so none
# of those rows are restated here — this layer adds only what the browser
# surface needs. As in every bundle patch, a `config` restatement replaces the
# row's whole config.

# Full-text session search stays opt-in, matching the Web value: one ephemeral
# in-memory index; a deployment enabling content search overrides `openAt`.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# ── web-only host rows, the transport layer, and the browser roster ─────────

- insert:
    # Host-owned opt-in sampled when a new Web session receives its preset
    # delegation tools. The Plugins page edits this settings namespace.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    # Browser Session export: `/export` command plus the shared download dialog.
    - id: session-log-download
      name: '@deepseek-ai/dsh-session-log-export'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    # Whole-log turn/step counts for the chat stats strip.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # Whole-log turn outline for the chat turn rail.
    - id: session-turn-outline
      name: '@deepseek-ai/dsh-session-turn-outline'

    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    # Session commands, cold reads, and live control over Typert Remote.
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    # Configuration-surface reads and writes over Typert Remote.
    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    # Workspace commands and reconnect-safe projection over Typert Remote.
    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # The workbench UI's direct KB channel: tree/read/write confined to the
    # kbRoot the yantao-kb plugin publishes. The UI is the human channel — it
    # may read and write any file; the ADR-0004 boundary binds only the agent.
    - id: yantao-kb-controller
      name: '@deepseek-ai/dsh-api-yantao-kb-controller'

    # Ordinary provider for the parsed Web flags (same `webStartup` service key
    # the stock surface uses; this composition never mounts the stock web-app).
    - id: web-startup
      name: '@deepseek-ai/dsh-yantao-web-app/startup'

    # ── layer 2: transport/service ──────────────────────────────────────────────

    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    # The same runtime glue as the stock surface: resolves the SAME built
    # frontend dist (apps/web's shell is reused as-is), mounts the
    # frontend-static fallback owner, registers the web-surface prompt section
    # and the bash runtime variable, prints the URL line, and opens the
    # canonical local URL after the full tree settles.
    - id: web-runtime
      name: '@deepseek-ai/dsh-yantao-web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

    # The client-plugin reload chain (idle unless pnpm run dev:web rebuilds).
    - id: client-hmr
      name: '@deepseek-ai/dsh-client-hmr'

    # ── browser plugin roster (dsh.client rows) ────────────────────────────────
    #
    # The stock web roster minus the coding-agent chrome the workbench does not
    # use, plus the KB workbench plugin. Omitted rows are absent rather than
    # disabled because every one of them is a web-app-side insert — nothing
    # re-adds them later. What each omission removes:
    #   ui-sidebar        → replaced by ui-yantao's intake rail (three-pane UI)
    #   ui-layout         → replaced by ui-yantao's own frame (ADR-0011)
    #   ui-cordis         → cordis_inspect view; the opt-in tool is not mounted here
    #   ui-workflow-run   → workflow lifecycle node; tool-workflow is disabled below
    #   ui-deliverables   → produced-files tail; kb_ writes are not tracked producers
    #   ui-subagent       → subagent views; no subagent tools in the yantao preset
    #   ui-skill          → '@' skill references; capabilities are invoked from the 能力 tab, not the composer
    #   ui-jobs           → background jobs list; tool-jobs is disabled below
    #   ui-goal           → GoalBar; the preset mounts no goal tools
    #   ui-plan           → plan-mode is disabled below
    #   ui-user-questions → ask_user tool is not mounted here
    #   ui-trajectory     → coding-turn trajectory analysis
    #   ui-schedule       → the Schedule overlay's client half (opt-in elsewhere)

    - id: modules
      name: '@deepseek-ai/dsh-client-modules'

    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      inject: [webRuntime]
      config:
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: cordis-client-runner
      name: '@deepseek-ai/dsh-cordis-client-runner'

    # The bespoke yantao workbench UI (ADR-0009/ADR-0011): our own React tree
    # over ctx.remote. It owns the whole browser shell: the runtime's built-in
    # 'root' slot carries our three-column frame, which keeps the host
    # conversation surface in its middle column and provides ctx.layout plus
    # the theme presenter ui-layout used to own.
    - id: ui-yantao
      name: '@deepseek-ai/dsh-client-ui-yantao'

    # Stepped aside (ADR-0011): ui-layout's AppFrame is replaced by
    # ui-yantao's own frame, so the row is no longer inserted at all — a
    # second 'root' registration cannot sit beside ours, because a root
    # entry's children table is exclusive (two frames declaring
    # 'conversation' throws). The two things ui-layout owned move with it:
    # the ctx.layout service (ui-chat injects 'layout') and the theme
    # presenter. The package stays a dependency for those contracts.

    - id: ui-theme
      name: '@deepseek-ai/dsh-client-ui-theme'

    - id: locale
      name: '@deepseek-ai/dsh-client-locale'

    - id: ui-renderer
      name: '@deepseek-ai/dsh-client-ui-renderer'

    - id: ui-session
      name: '@deepseek-ai/dsh-client-ui-session'

    - id: ui-settings
      name: '@deepseek-ai/dsh-client-ui-settings'

    - id: ui-settings-general
      name: '@deepseek-ai/dsh-client-ui-settings-general'

    - id: ui-settings-models
      name: '@deepseek-ai/dsh-client-ui-settings-models'

    - id: ui-settings-plugin-inventory
      name: '@deepseek-ai/dsh-client-ui-settings-plugin-inventory'

    - id: ui-conversation
      name: '@deepseek-ai/dsh-client-ui-conversation'

    - id: ui-approval
      name: '@deepseek-ai/dsh-client-ui-approval'

    - id: ui-chat
      name: '@deepseek-ai/dsh-client-ui-chat'

    # Official occupants for the generic sidebar brand slots (the workbench
    # sidebar re-declares them for this build).
    - id: ui-brand-official
      name: '@deepseek-ai/dsh-client-ui-brand-official'

    - id: ui-attachment
      name: '@deepseek-ai/dsh-client-ui-attachment'

    # Tool call tree, generic fallback, and keyed business Tool views — the
    # kb_ calls render here.
    - id: ui-tool
      name: '@deepseek-ai/dsh-client-ui-tool'

    # Stepped aside (ADR-0010): ui-yantao-kb's 'sidebar' tree and 'details'
    # editor duplicated the three-pane rails ui-yantao now owns. It is the
    # first row the shared shell loses; editing returns with the panes' own
    # detail view.
    # - id: ui-yantao-kb
    #   name: '@deepseek-ai/dsh-client-ui-yantao-kb'

    - id: ui-workspace
      name: '@deepseek-ai/dsh-client-ui-workspace'

    # Input triggers: the '/' | '@' pipeline, the command surface over it, and
    # the reference sources.
    - id: ui-input-trigger
      name: '@deepseek-ai/dsh-client-ui-input-trigger'

    - id: ui-commands
      name: '@deepseek-ai/dsh-client-ui-commands'

    - id: ui-reference
      name: '@deepseek-ai/dsh-client-ui-reference'

    # Per-message feedback: Like/Dislike plus an optional note in the
    # assistant-message action strip, over the messageFeedback Remote.
    - id: ui-message-feedback
      name: '@deepseek-ai/dsh-client-ui-message-feedback'

    # Model selection: the /model popupSelect + composer seat over session.models.
    - id: ui-model-selection
      name: '@deepseek-ai/dsh-client-ui-model-selection'

    - id: ui-permission
      name: '@deepseek-ai/dsh-client-ui-permission-presets'

    # The agent-preset row in General settings: the default preset for
    # sessions created later.
    - id: ui-agent-preset
      name: '@deepseek-ai/dsh-client-ui-agent-preset'

    # Plugin configuration: the host-plane sections a user owns, as expandable
    # cards (the yantao-kb kbRoot card renders here).
    - id: ui-settings-plugins
      name: '@deepseek-ai/dsh-client-ui-settings-plugins'

# ── the agent plane moves behind agent presets ─────────────────────────────
#
# The stock web surface disables every base host-plane agent row and lets each
# session mount a preset; this surface does the same. The yantao layer already
# disables tool-bash / tool-pwsh / tool-str-replace-editor; those rows are
# restated here so this layer reads complete on its own, and every other base
# agent-plane row is disabled exactly as on the stock web surface.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

# skill-filesystem stays enabled (ADR-0021): the capability system resolves
# skill directories through ctx.skills. tool-skill stays disabled — the model
# never sees a skill catalog; capabilities run from the human's UI only.
- id: tool-skill
  disabled: true

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# The preset roster names the yantao workbench preset as the default: the
# Chinese persona and NO tool rows, so a session's agent sees exactly the
# host-plane kb_ tools (the ADR-0004 boundary on this surface). The shipped
# presets stay selectable — switching presets is the human's informed act.
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: yantao
