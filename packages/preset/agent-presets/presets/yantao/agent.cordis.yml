# The `yantao` agent preset: the personal knowledge-workbench agent.
#
# This file is an AGENT-PLANE composition mounted once per process; every
# session naming it joins by scope parentage. It carries NO model-facing
# tool rows — deliberately. The yantao profile mounts the kb_ tool family in
# the HOST plane (the global tools layer), so a session on this preset sees
# exactly those tools and nothing else: no shell, no editor, no generic
# write capability. On the web surface, where tools are per-preset, this
# tool-lessness IS the ADR-0004 trust boundary.
#
# The compaction group below does not break that boundary (2026-09-30): it
# mounts no tool the model can call — `compaction-basic` is session
# infrastructure that summarizes old history under token pressure,
# `command-compact` is the human's `/compact`, and `tool-result-pruner`
# trims oversized tool results before summarization. The context the agent
# works in survives longer; the actions it may take do not change. Without
# these rows the workbench surface (yantao-web-app disables the base
# agent-plane compaction rows, like stock web) had no compaction at all.
#
# The persona is likewise NOT stated here (decision 2026-09-16, after
# ADR-0026's landing): a scoped persona row shadows the deployment persona
# with a second hand-copied text, and the copies did drift — workbench
# sessions kept reciting an overturned rule. This deployment is single-user
# with one profile, so the preset defers to the deployment persona stated in
# packages/bundle/yantao/cordis.patch.yml (`system-prompt` row) — the single
# source, pinned by packages/bundle/yantao/tests/persona.spec.ts. If this
# preset is ever mounted on a host that does not load that bundle, restate
# the persona here and flip that gate back to equality.

# ── compaction ──────────────────────────────────────────────────────────────

# Same shape as the `standard` preset: `compaction-basic` reads
# `toolResultPruner` through `ctx.get`, so both share this realm; the
# `tokenMeter` stays on the HOST plane (it owns the process-wide
# context-meter projection units) and is resolved from here. See
# .agents/notes/implemented/architecture/2026-08-10-host-plane-ownership-after-presets.md.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
