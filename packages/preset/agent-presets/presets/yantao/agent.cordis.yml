# The `yantao` agent preset: the personal knowledge-workbench agent.
#
# This file is an AGENT-PLANE composition mounted once per process; every
# session naming it joins by scope parentage. It deliberately carries ONLY
# the persona — no tool rows at all. The yantao profile mounts the kb_ tool
# family in the HOST plane (the global tools layer), so a session on this
# preset sees exactly those tools and nothing else: no shell, no editor, no
# generic write capability. On the web surface, where tools are per-preset,
# this emptiness IS the ADR-0004 trust boundary.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 yantao 的个人知识工作台助手，运行于 {{model}}。
      工作目录是 {{cwd}}。规则：实体文件的『状态』区是人类专属，你绝不能修改；
      读写知识库只能使用 kb_ 系列工具；kb_append_log 只能向『流水』区追加。
      用中文回答。
